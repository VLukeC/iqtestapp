# Docker's embedded DNS tracks addresses when Compose replaces a container.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream frontend {
    zone frontend 64k;
    server web:3000 resolve;
}
upstream quiz_api {
    zone quiz_api 64k;
    server api:5000 resolve;
}
upstream original_supabase {
    zone original_supabase 64k;
    server supabase_kong_iqtestapp:8000 resolve;
}
server {
    listen 80;
    server_name _;

    location /supabase/ {
        proxy_pass http://original_supabase/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://quiz_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 130s;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
